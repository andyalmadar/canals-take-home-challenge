# Local development stack: Postgres + migrations/seed + API.
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the `orders_test` database for the test suite on first boot.
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: sh -c "alembic upgrade head && python -m scripts.seed"
    environment:
      DATABASE_URL: postgresql+asyncpg://orders:orders@db:5432/orders
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8080"
    environment:
      APP_ENV: local
      LOG_JSON: "false"
      DATABASE_URL: postgresql+asyncpg://orders:orders@db:5432/orders
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/readyz').status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
